name: Deploy to self-hosted runner

on:
  workflow_run:
    workflows: [Build and publish Docker images]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: read
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and tag the published images
        run: |
          docker pull "$DOCKERHUB_USERNAME/movie-api:$IMAGE_TAG"
          docker pull "$DOCKERHUB_USERNAME/movie-ui:$IMAGE_TAG"
          docker tag "$DOCKERHUB_USERNAME/movie-api:$IMAGE_TAG" movie-api:1.0.0
          docker tag "$DOCKERHUB_USERNAME/movie-ui:$IMAGE_TAG" movie-ui:1.0.0

      - name: Deploy with Docker Compose
        run: docker compose up -d --no-build
