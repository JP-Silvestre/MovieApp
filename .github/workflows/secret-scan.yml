name: Secret scan

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2