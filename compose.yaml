services:
  movie-db:
    image: mongo:6.0
    container_name: movie-db
    ports:
      - "27017:27017"
    volumes:
      - movie-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/seed-movies.js:ro
      - ./mongo/init.json:/docker-entrypoint-initdb.d/init.json:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 3s
      retries: 10

  ollama:
      image: ollama/ollama
      container_name: ollama
      ports:
        - "11434:11434"
      volumes:
        - ollama-data:/root/.ollama

  ollama-model:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull gemma3:1b"]
    depends_on:
      ollama:
        condition: service_started

  movie-api:
    image: movie-api:1.0.0
    build:
      context: ./backend
    container_name: movie-api
    environment:
      MONGO_URI: mongodb://movie-db:27017/movies_db
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:1b
    ports:
      - "5001:5000"
    depends_on:
      movie-db:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully

  movie-ui:
    image: movie-ui:1.0.0
    build:
      context: ./frontend
    container_name: movie-ui
    ports:
      - "8181:80"
    depends_on:
      - movie-api

  

volumes:
  movie-data:
  ollama-data:
      
